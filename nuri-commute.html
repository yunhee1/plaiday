<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f7ff">
<title>누리의 출근 길찾기</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap');
:root{
  --ink:#2b3553;--muted:#7a84a0;--blue:#6176e8;--bg:#f4f7ff;
  --tile:#ffffff;--tile-slow:#fff4d6;--wall:#cdd5e6;--arrow:#9aa9e6;
  --goal-bg:#fff8e1;--gold:#f2b233;--trail:#bfe9d3;--me:#6176e8;
  --ok:#1f7a50;--warn:#8a5a00;--fail:#c2334b;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 0 0,#e6f8ef,transparent 40%),radial-gradient(circle at 100% 10%,#ffe9f1,transparent 35%),var(--bg);color:var(--ink);font-family:'Gowun Dodum',sans-serif}
.app{max-width:1080px;margin:0 auto;padding:22px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{font:26px Jua;color:#3a4a7a}
.place{font-size:13px;color:var(--muted);background:#fff;border:1px solid #e6eaf5;border-radius:20px;padding:8px 14px}
.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.card{background:#fff;border-radius:24px;box-shadow:0 14px 40px #3d4d8a14;padding:20px;min-width:0}
.side{display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:12px;color:var(--blue);font-weight:bold;letter-spacing:.04em}
h1{font:26px Jua;margin:4px 0 2px}
.sub{font-size:14px;color:var(--muted);margin:0}
.board{margin-top:14px;background:#e4e9f3;border:1px solid #d5dcea;border-radius:18px;padding:10px}
.grid{display:grid;gap:3px;min-width:0}
.tile{position:relative;min-width:0;aspect-ratio:1;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;cursor:pointer;user-select:none;font-size:clamp(11px,2.8vw,20px);line-height:1;transition:background .2s;overflow:hidden}
.tile .em{display:block}
.tile .min{position:absolute;top:2px;right:2px;font-size:clamp(8px,1.6vw,10px);font-weight:bold;color:var(--ink);background:#ffffffd9;border-radius:5px;padding:0 3px;line-height:1.4}
.tile .lbl{font-size:clamp(6px,1.2vw,9px);color:#4b5673;margin-top:2px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:clip}
.w1{background:var(--tile)}
.w2,.w3,.w4,.w5{background:var(--tile-slow)}
.wall{background:var(--wall);cursor:default}
.wall .em{font-size:.9em;opacity:.9}
.oneway{box-shadow:inset 0 0 0 2px var(--arrow)}
.goal{background:var(--goal-bg);box-shadow:inset 0 0 0 2px var(--gold)}
.goal .em{font-size:1.5em}
.goal{overflow:visible}
.goal .lbl{position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);max-width:none;overflow:visible;background:#fff;border:1.5px solid var(--gold);border-radius:6px;padding:1px 4px;font-weight:bold;color:var(--ink);font-size:clamp(9px,1.3vw,12px);z-index:2}
.trail{box-shadow:inset 0 0 0 3px var(--trail)}
.opt{outline:3px dashed #3fb27c;outline-offset:-4px}
.hintcell{box-shadow:inset 0 0 0 3px #f2b233;animation:pulse .7s infinite alternate}
.here{background:#e6ecff;box-shadow:0 0 0 3px var(--me);z-index:1}
.here .em{animation:bob .6s infinite alternate}
@keyframes bob{to{transform:translateY(-3px)}}
@keyframes pulse{to{box-shadow:inset 0 0 0 6px #ffe08a}}
.pad{display:grid;grid-template-columns:repeat(3,52px);gap:6px;justify-content:center;margin-top:14px}
.pad button{height:46px;font-size:20px;border:0;border-radius:14px;background:#eef0f8;cursor:pointer}
.pad .sp{visibility:hidden}
.status{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:14px;color:var(--muted)}
.status b{font:20px Jua;color:var(--ink)}
.checks{margin-top:8px;font-size:14px}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.stg{border:1px solid #e8ebf2;background:#fff;border-radius:12px;padding:9px 4px;font:14px Jua;color:#6b7591;cursor:pointer}
.stg.active{background:#6176e8;color:#fff;border-color:#6176e8}
.stg:disabled{background:#f5f6fa;color:#b5bccb;cursor:not-allowed}
.stg small{display:block;font:11px 'Gowun Dodum',sans-serif;margin-top:2px}
.rule{font-size:13px;line-height:1.6;color:#6e7890;background:#f6f7fb;border-radius:12px;padding:11px;margin-top:14px}
.math{font-size:13px;line-height:1.7;color:#727d93;margin-top:12px}
.math b{color:#4455b5}
.result{text-align:center;background:linear-gradient(180deg,#effcf5,#fff);border:2px solid #9fe3c1}
.result .stars{font-size:30px;letter-spacing:4px}
.result h2{font:26px Jua;margin:6px 0;color:var(--ok)}
.result p{font-size:14px;line-height:1.6;color:#6e7890;margin:6px 0}
.row{display:flex;gap:8px;margin-top:14px}
.button{flex:1;border:0;border-radius:13px;padding:12px;font:16px Jua;cursor:pointer;background:#eef0f8;color:#5f6b88}
.button.primary{background:#6176e8;color:#fff;box-shadow:0 7px 16px #6176e83b}
.button:disabled{opacity:.4;cursor:not-allowed}
.hint{font-size:13px;color:#8992a4;margin-top:10px;min-height:18px}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.25s;background:#26334f;color:#fff;border-radius:14px;padding:12px 18px;font-size:14px;z-index:10;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font:14px Jua;padding:4px 12px;border-radius:20px;white-space:nowrap}
.badge.run{background:#eef0ff;color:#4455b5}
.badge.left{background:#fff1d1;color:var(--warn)}
.badge.ok{background:#dff5ea;color:var(--ok)}
.badge.fail{background:#ffe1e6;color:var(--fail)}
.status .hot,.status .hot b{color:var(--fail)}
.msg{margin-top:10px;min-height:44px;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5;color:var(--muted)}
.msg.warn{background:#fff4e0;color:var(--warn)}
.msg.fail{background:#ffe9ed;color:var(--fail);font-weight:bold}
.modal{position:fixed;inset:0;background:#1d2a5a59;backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;z-index:20}
.modal-card{background:#fff;border-radius:24px;padding:24px;max-width:440px;width:100%;box-shadow:0 20px 60px #1d2a5a40}
.modal-card h2{font:26px Jua;margin:6px 0 8px}
.mission{margin-top:14px;background:#f6f7fb;border-radius:14px;padding:12px 14px}
.mission-h{font:16px Jua;color:#4455b5;margin-bottom:4px}
.mission ul{margin:0;padding-left:18px;font-size:15px;line-height:1.8}
.modal-go{width:100%;margin-top:16px;padding:14px;flex:none}
@media(max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
@media(max-width:480px){.app{padding:16px 12px 32px}.card{padding:16px;border-radius:20px}h1{font-size:22px}.pad{grid-template-columns:repeat(3,58px)}.tile:not(.goal) .lbl{display:none}.tile .min{font-size:8px}.board{padding:8px}.grid{gap:2px}.stages{gap:5px}.stg{font-size:13px;padding:8px 2px}}
</style>
</head>
<body>
<main class="app">
<header class="top">
  <div class="brand">🐰 누리의 출근 길찾기</div>
  <div class="place">📍 홍대입구역 → 누리미디어</div>
</header>

<div class="layout">
  <section class="card">
    <div class="head"><div class="eyebrow" id="tag"></div><span class="badge" id="badge"></span></div>
    <h1 id="title"></h1>
    <p class="sub" id="story"></p>

    <div class="board"><div class="grid" id="grid" role="grid" aria-label="출근길 지도"></div></div>

    <div class="pad">
      <span class="sp"></span><button data-d="U" aria-label="위로">⬆️</button><span class="sp"></span>
      <button data-d="L" aria-label="왼쪽">⬅️</button><span class="sp"></span><button data-d="R" aria-label="오른쪽">➡️</button>
      <span class="sp"></span><button data-d="D" aria-label="아래로">⬇️</button><span class="sp"></span>
    </div>

    <div class="status">
      <span>지금까지 <b id="cost">0</b>분</span>
      <span id="failBox">실패 <b id="fails">0</b>번</span>
    </div>
    <div class="checks" id="checks"></div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </section>

  <aside class="side">
    <section class="card">
      <div class="stages" id="stages"></div>
      <div class="rule" id="rule"></div>
      <div class="math" id="math"></div>
    </section>

    <section class="card result" id="result" hidden>
      <div class="stars" id="resStars"></div>
      <h2>정답 길로 도착! 🎉</h2>
      <p id="resText"></p>
      <p id="resLesson"></p>
      <div class="row">
        <button class="button" id="retry">다시 하기</button>
        <button class="button primary" id="next">다음 단계</button>
      </div>
    </section>

    <section class="card">
      <div class="row" style="margin-top:0">
        <button class="button" id="reset">처음부터</button>
        <button class="button" id="hintBtn">💡 힌트</button>
      </div>
      <div class="hint" id="hint"></div>
    </section>
  </aside>
</div>
</main>
<div class="toast" id="toast"></div>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="eyebrow" id="mTag"></div>
    <h2 id="mTitle"></h2>
    <p class="sub" id="mStory"></p>
    <div class="mission">
      <div class="mission-h">오늘의 미션</div>
      <ul id="mMission"></ul>
    </div>
    <div class="rule" id="mRule"></div>
    <button class="button primary modal-go" id="startBtn">시작하기</button>
  </div>
</div>

<script>
// 지도 기호: . 보통(1분) / 2~9 숫자는 그 칸에 드는 분 / # 건물 / S 출발 / G 누리미디어
// C 카페, K 편의점(반드시 들러야 함) / ⬆️⬇️⬅️➡️ 칸은 그 방향으로만 빠져나갈 수 있어요
// 모든 지도는 정답 길이 하나뿐이고, 그 길로만 성공해요.
const DIRS={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};
const ARROW={'^':'U','v':'D','<':'L','>':'R'};
const NAME={U:'위',D:'아래',L:'왼쪽',R:'오른쪽'};
const KEYS={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R',w:'U',W:'U',s:'D',S:'D',a:'L',A:'L',d:'R',D:'R'};
const LABEL={S:'홍대입구',G:'누리미디어',C:'카페',K:'편의점'};
const KEY='nuri-commute-v2';
const MEDAL={3:{e:'🥇',n:'금메달'},2:{e:'🥈',n:'은메달'},1:{e:'🥉',n:'동메달'}};

const STAGES=[
 {
  tag:'1단계 · 골목 탐색', title:'첫 출근 길',
  story:'홍대 골목은 길이 많아 보여도, 누리미디어로 가는 정답 길은 하나뿐이에요.',
  rule:'칸 속 숫자는 그 칸에 들어가는 데 걸리는 분이에요. 2분 칸이 섞여 있어서 1분 차이로 갈리는 길이 많아요. 정답 길로 도착해야 성공이에요.',
  math:'<b>최단 경로</b>: 지나간 칸의 숫자를 모두 더했을 때 합이 가장 작은 길을 찾아요. 비슷해 보이는 길이 많으니 합을 꼼꼼히 비교해요.',
  lesson:'막힌 곳을 피하면서 합이 가장 작은 길을 찾는 것, 이게 최단 경로 문제예요. 길이 많을수록 모든 경로의 합을 일일이 비교하기 어려워서, 다익스트라 같은 알고리즘이 필요해져요.',
  map:[
   '#..2##...#..#',
   '2.#....#.##..',
   'S#22.#2##..2#',
   '.#.###..##.#.',
   '#.#...#..#.##',
   '#...#2.222.#G',
   '.####2.2##..2',
   '.#..2#2..2#.#',
   '##..##.##.2..'
  ]
 },
 {
  tag:'2단계 · 출근 시간 골목', title:'사람 많은 골목',
  story:'출근 시간이라 골목마다 사람이 몰렸어요. 길이 워낙 많아서 1분 차이로 갈리는 길이 줄줄이 있어요.',
  rule:'👥 2분, 🚧 3분, 🌧️ 4분처럼 숫자가 클수록 느려요. 틀린 길과 정답의 차이가 1분뿐이니 꼼꼼히 따져 보세요.',
  math:'<b>가중치 그래프</b>: 칸마다 드는 시간이 달라요. 가장 가벼운 경로(비용의 합이 최소인 길)를 찾아야 해요. 후보가 많을수록 손으로 전부 더해 보기 어려워요.',
  lesson:'가중치가 있는 그래프에서는 다익스트라(Dijkstra) 알고리즘을 써요. 가장 가까운 칸부터 확정해 나가는 방식이라 지도 앱이 길을 찾는 원리와 비슷해요.',
  map:[
   '#.42#.#..2224..',
   '4##.####2#.#..4',
   '3#.##..#23####G',
   '2.#.3#.2...#342',
   '#.###2#.######4',
   'S#4#4.#2#4..3..',
   '4###..#2#..###.',
   '.2##.4#.#.####4',
   '3.2#.####24#.##',
   '2#.#3..#2.44..4',
   '#..223.3.#3..2#'
  ]
 },
 {
  tag:'3단계 · 일방통행 뒷골목', title:'화살표 뒷골목',
  story:'일방통행이 얽힌 뒷골목이에요. 화살표를 잘 읽지 않으면 막다른 길에 갇혀요.',
  rule:'⬆️⬇️⬅️➡️ 칸은 화살표 방향으로만 빠져나올 수 있어요. 들어가는 건 어느 쪽에서든 괜찮아요. 정답 길에는 일방통행 칸이 꼭 들어 있어요.',
  math:'<b>유향 그래프</b>: 간선에 방향이 있어요. 같은 지도라도 방향 규칙에 따라 최단 경로가 달라져요. 틀린 길과 1분 차이라서, 방향 규칙을 빼먹으면 바로 틀려요.',
  lesson:'방향이 있는 간선만 따라갈 수 있어서, 이동 가능한 방향을 먼저 확인해야 최단 경로를 찾을 수 있어요.',
  map:[
   '....2#3.#....2.',
   '.3.#2##2##3#.#.',
   '#.#3.2#.##2..#.',
   '3....##.#.3#<#G',
   '3#..2..3#.#..3v',
   '..#3.>.3#2##..#',
   '#.#..#33....#..',
   '##.>#2..###<..#',
   '#S#3...###v#..#',
   '...^#.#...^.3.#',
   '#2#3..#.....#.3'
  ]
 },
 {
  tag:'4단계 · 커피 한 잔 하고 출근', title:'카페와 편의점 들르기',
  story:'카페와 편의점을 들러야 출근 완료예요. 길이 복잡해서 두 곳을 들르는 순서와 경로를 함께 따져야 해요.',
  rule:'☕ 카페와 🏪 편의점을 모두 들른 뒤 🏢 누리미디어에 도착해야 해요. 누리미디어는 두 곳을 들르기 전에는 들어갈 수 없어요.',
  math:'<b>순열과 최단 경로</b>: 경유지 순서가 여러 가지예요. 모든 순서의 최단 경로 합을 비교하면 정답 하나가 나와요.',
  lesson:'경유지가 늘어날수록 순서의 경우의 수가 빠르게 많아져요. 외판원 문제(TSP)와 비슷한 어려움이에요.',
  map:[
   '..##3..#3.#^.3#',
   '>.#...#..K3.33.',
   'v#.3##2<2#.###.',
   '#.32>.223##....',
   'S.#2.##2#.2#.#.',
   '##...###...<C3G',
   '#2#.v#..2##.##3',
   '.#.#.#####..3.3',
   '#.3#....##..3.#',
   '2..2#.##..2..#.',
   '3#.2..###^##2#.'
  ]
 }
];

let si=0, st=null, pos=[0,0], cost=0, fails=0, hints=0, visited=new Set(), trail=new Set(), hintKey=null, done=false, lastFail=false;
const $=s=>document.querySelector(s);
const key=(x,y)=>x+','+y;
const idx=(x,y)=>y*st.W+x;
const cellAt=(x,y)=>st.cells[idx(x,y)];
const inside=(x,y)=>x>=0&&y>=0&&x<st.W&&y<st.H;

function toast(msg){
  const t=$('#toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer=setTimeout(()=>t.classList.remove('show'),1800);
}

// 안내 문구를 화면 상태 줄에 보여 줘요. 다음 성공 이동 전까지 남아 있어요
function setMsg(text,kind='warn'){
  const m=$('#msg');
  m.textContent=text;
  m.className='msg'+(text?' '+kind:'');
}

// 막힌 이동이나 실패는 배지와 메시지로 계속 보여 줘요
function failWith(text){
  lastFail=true;
  setMsg(text,'fail');
  updateBadge();
}

// 상단 배지: 진행 중 / 경유지 남음 / 실패 / 성공
function updateBadge(){
  const b=$('#badge');
  const left=st.checks.some(c=>!visited.has(key(c.x,c.y)));
  let text='진행 중', kind='run';
  if(done){text='성공 🎉'; kind='ok';}
  else if(lastFail){text='실패 · 다시 도전'; kind='fail';}
  else if(left){text='경유지 남음'; kind='left';}
  b.textContent=text;
  b.className='badge '+kind;
}

// 스테이지를 시작할 때 미션을 모달로 보여 줘요
function showMission(){
  const s=STAGES[si];
  $('#mTag').textContent=s.tag;
  $('#mTitle').textContent=s.title;
  $('#mStory').textContent=s.story;
  $('#mRule').textContent=s.rule;
  const items=st.checks.map(c=>`<li>${c.ch==='C'?'☕ 카페':'🏪 편의점'}에 들르기</li>`);
  items.push('<li>🏢 누리미디어에 가장 빠른 길로 도착하기<br><small>(다른 길이면 처음부터 다시 시작해요)</small></li>');
  $('#mMission').innerHTML=items.join('');
  $('#modal').hidden=false;
  $('#startBtn').focus();
}
function closeMission(){ $('#modal').hidden=true; }

// 다익스트라: 시작점에서 각 칸까지 최소 비용. 들어간 칸의 숫자가 그 칸의 비용
function dijkstra(from){
  const N=st.W*st.H, dist=Array(N).fill(Infinity), prev=Array(N).fill(-1), fixed=Array(N).fill(false);
  const s=idx(from[0],from[1]);
  dist[s]=0;
  for(;;){
    let u=-1;
    for(let i=0;i<N;i++) if(!fixed[i]&&dist[i]<Infinity&&(u<0||dist[i]<dist[u])) u=i;
    if(u<0) break;
    fixed[u]=true;
    const ux=u%st.W, uy=Math.floor(u/st.W), uc=st.cells[u];
    if(u!==s&&uc.ch==='G') continue; // 누리미디어는 목적지로만 쓰고 지나가지 않아요
    for(const d in DIRS){
      if(uc.dir&&uc.dir!==d) continue;
      const [dx,dy]=DIRS[d], nx=ux+dx, ny=uy+dy;
      if(!inside(nx,ny)) continue;
      const v=idx(nx,ny), vc=st.cells[v];
      if(vc.wall) continue;
      if(dist[u]+vc.w<dist[v]){dist[v]=dist[u]+vc.w; prev[v]=u;}
    }
  }
  return {dist,prev};
}

function trace(res,t){
  if(res.dist[t]===Infinity) return null;
  const out=[];
  let v=t;
  while(res.prev[v]>=0){
    out.unshift([v%st.W,Math.floor(v/st.W)]);
    v=res.prev[v];
  }
  return out;
}

function perms(a){
  if(a.length<=1) return [a];
  return a.flatMap((x,i)=>perms([...a.slice(0,i),...a.slice(i+1)]).map(p=>[x,...p]));
}

// 경유지 순서를 전부 비교해서 가장 짧은 경로를 고름
function bestRoute(from,checks){
  let best=null;
  for(const order of perms(checks)){
    let cur=from, total=0, cells=[];
    for(const p of [...order,{x:st.goal[0],y:st.goal[1]}]){
      const res=dijkstra(cur), t=idx(p.x,p.y);
      const seg=trace(res,t);
      if(!seg){total=Infinity;break}
      total+=res.dist[t];
      cells.push(...seg);
      cur=[p.x,p.y];
    }
    if(total<Infinity&&(!best||total<best.cost)) best={cost:total,cells};
  }
  return best;
}

function allVisited(){
  return st.checks.every(c=>visited.has(key(c.x,c.y)));
}

function load(i){
  si=i;
  const s=STAGES[i], H=s.map.length, W=s.map[0].length;
  st={W,H,cells:[],start:null,goal:null,checks:[],opt:0,optKeys:new Set()};
  s.map.forEach((row,y)=>[...row].forEach((ch,x)=>{
    const c={ch,w:1,dir:null,wall:ch==='#'};
    if(/[2-9]/.test(ch)) c.w=+ch;
    if(ARROW[ch]) c.dir=ARROW[ch];
    if(ch==='S') st.start=[x,y];
    if(ch==='G') st.goal=[x,y];
    if(ch==='C'||ch==='K') st.checks.push({x,y,ch});
    st.cells[y*W+x]=c;
  }));
  const best=bestRoute(st.start,st.checks);
  st.opt=best.cost;
  st.optKeys=new Set(best.cells.map(([x,y])=>key(x,y)));
  fails=0; hints=0; lastFail=false;
  $('#hint').textContent='';
  $('#result').hidden=true;
  restartRun();
  setMsg('');
  showMission();
}

// 출발점으로 돌아가 다시 시작 (실패 횟수와 힌트 횟수는 단계 안에서 유지)
function restartRun(){
  pos=[...st.start];
  cost=0; visited=new Set(); trail=new Set(); hintKey=null; done=false;
  render();
}

function move(d){
  if(done) return;
  const [dx,dy]=DIRS[d], nx=pos[0]+dx, ny=pos[1]+dy;
  if(!inside(nx,ny)) return failWith('지도 밖으로는 못 나가요!');
  const from=cellAt(pos[0],pos[1]), to=cellAt(nx,ny);
  if(to.wall) return failWith('건물 안으로는 못 들어가요 🏢');
  if(from.dir&&from.dir!==d) return failWith('이 칸은 화살표 방향으로만 나갈 수 있어요');
  if(to.ch==='G'&&!allVisited()) return failWith('카페와 편의점을 먼저 들러요!');
  if(to.ch==='G'&&cost+to.w!==st.opt){
    fails++;
    restartRun();
    return failWith('정답 길이 아니에요! 처음부터 다시 출발해요 🏃');
  }
  lastFail=false;
  setMsg('');
  trail.add(key(pos[0],pos[1]));
  pos=[nx,ny];
  cost+=to.w;
  hintKey=null;
  if(to.ch==='C'||to.ch==='K') visited.add(key(nx,ny));
  if(to.ch==='G') finish();
  render();
}

function clickTile(x,y){
  const dx=x-pos[0], dy=y-pos[1];
  if(dx===0&&dy===0) return;
  const d=Object.keys(DIRS).find(k=>DIRS[k][0]===dx&&DIRS[k][1]===dy);
  if(d) move(d); else setMsg('바로 옆 칸만 눌러서 움직일 수 있어요');
}

function hint(){
  if(done) return;
  const rem=st.checks.filter(c=>!visited.has(key(c.x,c.y)));
  const best=bestRoute(pos,rem);
  if(!best||!best.cells.length) return;
  const [x,y]=best.cells[0];
  const d=Object.keys(DIRS).find(k=>DIRS[k][0]===x-pos[0]&&DIRS[k][1]===y-pos[1]);
  hints++;
  hintKey=key(x,y);
  $('#hint').textContent=`💡 정답 길의 다음 칸은 ${NAME[d]}쪽이에요. (힌트를 쓰면 별이 줄어요)`;
  render();
}

function calcStars(){
  const used=fails+hints;
  if(used===0) return 3;
  return used<=2?2:1;
}

function finish(){
  done=true;
  const stars=calcStars();
  const prog=readProgress(), prev=prog[si];
  if(!prev||stars>prev.stars) prog[si]={stars};
  writeProgress(prog);
  $('#resStars').textContent=MEDAL[stars].e;
  $('#resText').textContent=`${MEDAL[stars].n} 획득! ${cost}분 만에 가장 빠른 길로 도착했어요. 실패 ${fails}번, 힌트 ${hints}번 썼어요.`;
  $('#resLesson').textContent=STAGES[si].lesson;
  $('#next').disabled=si===STAGES.length-1;
  $('#result').hidden=false;
  $('#result').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function readProgress(){
  try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}
}
function writeProgress(data){
  try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}
}

function renderStages(){
  const prog=readProgress();
  const box=$('#stages');
  box.innerHTML='';
  STAGES.forEach((s,i)=>{
    const unlocked=i===0||!!prog[i-1];
    const b=document.createElement('button');
    b.className='stg'+(i===si?' active':'');
    b.disabled=!unlocked;
    b.innerHTML=`${i+1}단계${unlocked?'':' 🔒'}`+(prog[i]?`<small>${MEDAL[prog[i].stars].e} ${MEDAL[prog[i].stars].n}</small>`:'');
    b.onclick=()=>load(i);
    box.append(b);
  });
}

function emojiFor(x,y,c){
  if(pos[0]===x&&pos[1]===y) return '🐰';
  if(c.ch==='S') return '🚇';
  if(c.ch==='G') return '🏢';
  if(c.ch==='C') return '☕';
  if(c.ch==='K') return '🏪';
  if(c.wall) return ['🏠','🏡','🏬','🏫'][(x*3+y)%4];
  if(c.dir) return {U:'⬆️',D:'⬇️',L:'⬅️',R:'➡️'}[c.dir];
  return ['','','','👥','🚧','🌧️','🚨'][c.w]||'';
}

function render(){
  const s=STAGES[si];
  $('#tag').textContent=s.tag;
  $('#title').textContent=s.title;
  $('#story').textContent=s.story;
  $('#rule').textContent=s.rule;
  $('#math').innerHTML=s.math;
  $('#cost').textContent=cost;
  $('#fails').textContent=fails;
  $('#failBox').classList.toggle('hot',fails>0);
  $('#checks').textContent=st.checks.length
    ? st.checks.map(c=>`${c.ch==='C'?'☕ 카페':'🏪 편의점'} ${visited.has(key(c.x,c.y))?'✅':'⬜'}`).join('   ')
    : '경유지 없이 바로 출근!';
  renderStages();
  updateBadge();

  const grid=$('#grid');
  grid.innerHTML='';
  grid.style.gridTemplateColumns=`repeat(${st.W},minmax(0,1fr))`;
  for(let y=0;y<st.H;y++) for(let x=0;x<st.W;x++){
    const c=cellAt(x,y), k=key(x,y), el=document.createElement('div');
    let cls='tile';
    if(c.wall) cls+=' wall';
    else cls+=' w'+c.w;
    if(c.dir) cls+=' oneway';
    if(c.ch==='G') cls+=' goal';
    if(trail.has(k)) cls+=' trail';
    if(done&&st.optKeys.has(k)) cls+=' opt';
    if(hintKey===k) cls+=' hintcell';
    if(pos[0]===x&&pos[1]===y) cls+=' here';
    el.className=cls;
    el.setAttribute('role','gridcell');
    let inner=`<span class="em">${emojiFor(x,y,c)}</span>`;
    if(!c.wall) inner+=`<span class="min">${c.w}</span>`;
    if(LABEL[c.ch]) inner+=`<span class="lbl">${LABEL[c.ch]}</span>`;
    el.innerHTML=inner;
    if(!c.wall) el.onclick=()=>clickTile(x,y);
    grid.append(el);
  }
}

document.addEventListener('keydown',e=>{
  // 미션 모달이 열려 있으면 이동 키를 막고, Enter나 Esc로 닫아요
  if(!$('#modal').hidden){
    if(['Enter','Escape',' '].includes(e.key)){e.preventDefault();closeMission()}
    return;
  }
  if(KEYS[e.key]){e.preventDefault();move(KEYS[e.key])}
});
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>move(b.dataset.d));
$('#reset').onclick=()=>{lastFail=false; setMsg(''); restartRun();};
$('#startBtn').onclick=closeMission;
$('#retry').onclick=()=>load(si);
$('#hintBtn').onclick=hint;
$('#next').onclick=()=>{
  if(si<STAGES.length-1) load(si+1);
  else toast('모든 출근길을 완주했어요! 🎉');
};

load(0);
</script>
</body>
</html>
